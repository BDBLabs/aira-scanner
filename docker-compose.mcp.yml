services:
  nvidiareview-mcp:
    build:
      context: .
      dockerfile: Dockerfile.nvidiareview
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      AIRA_NVIDIA_MODEL: ${AIRA_NVIDIA_MODEL:-openai/gpt-oss-20b}
      AIRA_TIMEOUT: 120
      AIRA_MAX_CONTEXT_CHARS: 120000
    restart: unless-stopped
