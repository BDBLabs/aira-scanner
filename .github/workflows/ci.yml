name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CLI

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff bandit pip-audit
      - run: ruff check aira/ tests/ --select E4,E7,E9,F,I --output-format github
      - run: bandit -r aira/ -ll -f json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print('Security findings:', len(d.get('results',[])))" || true
      - run: pip-audit --requirement pyproject.toml 2>/dev/null || true

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    defaults:
      run:
        working-directory: CLI

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -v --cov=aira --cov-fail-under=80